name: Validate Problems
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install validators
        run: pip install pyyaml jsonschema
      - name: Validate YAML
        run: python3 scripts/validate_yaml.py
      - name: Build problems index
        run: python3 scripts/build_index.py
      - name: Upload index.json
        uses: actions/upload-artifact@v4
        with:
          name: problems-index
          path: problems/index.json
